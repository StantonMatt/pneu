<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pneu Mockups</title>
<style>
:root{
  --page:#E4E6EA; --page-ink:#1E2227; --page-sub:#5A616B; --page-line:#C9CDD3; --page-card:#F4F5F7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#141619; --page-ink:#E6E8EB; --page-sub:#9AA1AA; --page-line:#2C3036; --page-card:#1C1F23; }
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .phone, :root:not([data-theme="light"]) .shade, :root:not([data-theme="light"]) .qs{box-shadow:0 0 0 1px rgba(255,255,255,.14)} }
:root[data-theme="dark"] .phone,:root[data-theme="dark"] .shade,:root[data-theme="dark"] .qs{box-shadow:0 0 0 1px rgba(255,255,255,.14)}
:root[data-theme="dark"]{ --page:#141619; --page-ink:#E6E8EB; --page-sub:#9AA1AA; --page-line:#2C3036; --page-card:#1C1F23; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--page-ink);font-family:"Noto Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1760px;margin:0 auto;padding:24px 16px 80px}
.pagehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.pagehead h1{font-size:24px;font-weight:600;margin:0}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.toc a{color:var(--page-ink);text-decoration:none;font-size:13px;padding:6px 10px;border-radius:6px;background:var(--page-card);border:1px solid var(--page-line)}
h2.sec{font-size:20px;font-weight:600;margin:48px 0 4px;padding-top:12px;border-top:1px solid var(--page-line)}
.mocks{display:flex;flex-wrap:wrap;gap:0 32px;align-items:flex-start}
.mock{margin:28px 0;flex:none;max-width:100%}
.mock h3{font-size:15px;font-weight:600;margin:0 0 4px}
.mock p.note{font-size:13px;color:var(--page-sub);margin:0 0 12px;max-width:848px;line-height:1.45}
.mock h3{max-width:848px}
.pair{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.grid{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:12px;color:var(--page-sub);margin:6px 0 0}
svg{display:block}

/* ---------------- Material 3 (phone) ---------------- */
.m3{
  --primary:#415F91;--on-primary:#FFFFFF;--primary-container:#D6E3FF;--on-primary-container:#284777;
  --secondary-container:#DAE2F9;--on-secondary-container:#3E4759;
  --tertiary-container:#FAD8FD;--on-tertiary-container:#573E5C;
  --error:#BA1A1A;--error-container:#FFDAD6;--on-error-container:#93000A;
  --surface:#F9F9FF;--sc-lowest:#FFFFFF;--sc-low:#F3F3FA;--sc:#EDEDF4;--sc-high:#E7E8EE;--sc-highest:#E2E2E9;
  --on-surface:#191C20;--on-surface-variant:#44474E;--outline:#74777F;--outline-variant:#C4C6D0;
  --inverse-surface:#2E3036;--inverse-on-surface:#F0F0F7;--inverse-primary:#AAC7FF;
  --screen:var(--sc);--group:var(--sc-lowest);--scrim:rgba(0,0,0,.32);
  --shade:#DCE0E8;--shade-card:rgba(255,255,255,.92);
}
.m3.dark{
  --primary:#AAC7FF;--on-primary:#0A305F;--primary-container:#284777;--on-primary-container:#D6E3FF;
  --secondary-container:#3E4759;--on-secondary-container:#DAE2F9;
  --tertiary-container:#573E5C;--on-tertiary-container:#FAD8FD;
  --error:#FFB4AB;--error-container:#93000A;--on-error-container:#FFDAD6;
  --surface:#111318;--sc-lowest:#0C0E13;--sc-low:#191C20;--sc:#1D2024;--sc-high:#282A2F;--sc-highest:#33353A;
  --on-surface:#E2E2E9;--on-surface-variant:#C4C6D0;--outline:#8E9099;--outline-variant:#44474E;
  --inverse-surface:#E2E2E9;--inverse-on-surface:#2E3036;--inverse-primary:#415F91;
  --screen:var(--surface);--group:var(--sc-high);--scrim:rgba(0,0,0,.5);
  --shade:#0B0C0E;--shade-card:#202226;
}
.m3{font-family:Roboto,"Noto Sans",system-ui,sans-serif;color:var(--on-surface);letter-spacing:.1px}
.phone{width:412px;height:892px;border-radius:38px;overflow:hidden;position:relative;background:var(--screen);display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.14);flex:none}
.phone.tall{height:auto}
.sb{height:36px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:14px;font-weight:500;flex:none;color:var(--on-surface)}
.sb .r{display:flex;gap:5px;align-items:center}
.navbar{height:26px;flex:none;display:flex;justify-content:center;align-items:center}
.navbar::after{content:"";width:110px;height:4px;border-radius:2px;background:var(--on-surface);opacity:.45}
.body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;overflow:hidden;padding:0 16px}
.tab{height:64px;display:flex;align-items:center;padding:0 4px 0 16px;flex:none}
.tab .t{font-size:22px;line-height:28px;flex:1}
.tab.nav{padding-left:4px}
.tab.nav .t{margin-left:4px}
.ltab{flex:none;height:152px;display:flex;flex-direction:column;padding:0 4px}
.ltab .top{height:64px;display:flex;align-items:center}
.ltab .t{font-size:28px;line-height:36px;margin:auto 0 24px 12px}
.ltab.nonav .t{margin-left:12px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;color:var(--on-surface-variant);flex:none}
.ib.on-surface{color:var(--on-surface)}
.card{background:var(--group);border-radius:24px;overflow:hidden}
.gh{font-size:14px;font-weight:500;color:var(--primary);padding:24px 16px 8px;display:flex;align-items:center;justify-content:space-between;line-height:20px}
.gh.first{padding-top:8px}
.gh .tb{color:var(--primary);font-size:14px;font-weight:500;padding:6px 12px;margin:-6px -12px -6px 0;border-radius:18px}
.li{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 16px}
.li.two{min-height:72px}
.li .lead{flex:none;color:var(--on-surface-variant);display:grid;place-items:center}
.li .txt{flex:1;min-width:0}
.li .h{font-size:16px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:14px;line-height:20px;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s.err,.li .h.err{color:var(--error)}
.li.disabled .txt,.li.disabled .switch{opacity:.38}
.li .trail{flex:none;display:flex;align-items:center;gap:0;margin-right:-8px}
.switch{width:52px;height:32px;border-radius:16px;position:relative;flex:none;border:2px solid var(--outline);background:var(--sc-highest)}
.switch::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--outline);left:6px;top:6px}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{width:24px;height:24px;left:22px;top:2px;background:var(--on-primary)}
.switch.on .chk{position:absolute;left:26px;top:6px;color:var(--on-primary-container);z-index:1}
.btn{height:40px;border-radius:20px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;letter-spacing:.1px;white-space:nowrap;flex:none}
.btn.sm{height:36px;padding:0 16px;border-radius:18px}
.btn.lg{height:48px;border-radius:24px}
.btn.xl{height:56px;border-radius:28px;font-size:16px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{border:1px solid var(--outline);color:var(--on-surface-variant)}
.btn.outlined.prim{color:var(--primary)}
.btn.text{color:var(--primary);padding:0 12px}
.btn.disabled{background:rgba(127,127,127,.12)!important;color:var(--on-surface)!important;opacity:.38;border-color:transparent}
.btn.outlined.disabled{background:transparent!important;border:1px solid var(--on-surface)}
.btn.wide{flex:1 1 0;min-width:0}
.btn svg{flex:none}
.hero{background:var(--group);border-radius:28px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;position:relative}
.disc.ok{background:var(--primary-container);color:var(--on-primary-container)}
.disc.neutral{background:var(--sc-highest);color:var(--on-surface-variant)}
.disc.paused{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.disc.err{background:var(--error-container);color:var(--on-error-container)}
.disc .ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--primary);border-right-color:transparent;border-bottom-color:transparent;transform:rotate(25deg)}
.hero .ht{font-size:24px;line-height:32px;margin-top:16px}
.hero .hd{font-size:14px;line-height:20px;color:var(--on-surface-variant);margin-top:4px;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .hb{display:flex;gap:8px;width:100%;margin-top:20px}
.banner{background:var(--error-container);color:var(--on-error-container);border-radius:16px;display:flex;align-items:center;gap:12px;padding:4px 4px 4px 16px;min-height:56px;margin-bottom:16px}
.banner .bt{flex:1;font-size:14px;line-height:20px}
.banner .btn.text{color:var(--on-error-container)}
.thumb{width:48px;height:48px;border-radius:12px;overflow:hidden;position:relative;flex:none;background:#888}
.thumb svg{width:100%;height:100%}
.thumb .play{position:absolute;left:3px;bottom:3px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.tile48{width:48px;height:48px;border-radius:12px;background:var(--secondary-container);color:var(--on-secondary-container);display:grid;place-items:center;flex:none}
.prog{position:relative;width:48px;height:48px;display:grid;place-items:center;color:var(--on-surface-variant)}
.prog svg.ringp{position:absolute;inset:6px}
.empty{height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--on-surface-variant);font-size:14px}
.chk-done{color:var(--primary)}
.fixed-bottom{padding:12px 16px 12px;flex:none}
.scrimfull{position:absolute;inset:0;background:var(--scrim)}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:312px;background:var(--sc-high);border-radius:28px;padding:24px 24px 20px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.m3.dark .dialog{background:var(--sc-high)}
.dialog .dt{font-size:24px;line-height:32px;margin-bottom:16px}
.dialog .dx{font-size:14px;line-height:20px;color:var(--on-surface-variant)}
.dialog .da{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.snack{position:absolute;left:16px;right:16px;bottom:16px;background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:4px;min-height:48px;display:flex;align-items:center;padding:14px 16px;font-size:14px;line-height:20px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
/* camera */
.cam{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,#5b6068 0%,#2d3035 55%,#141518 100%)}
.cam .monitor{position:absolute;left:40px;right:40px;top:150px;height:380px;border-radius:14px;background:linear-gradient(#cfd3d8,#aeb3ba);box-shadow:0 0 0 10px #1a1c1f,0 20px 60px rgba(0,0,0,.6);transform:perspective(900px) rotateX(6deg) rotateY(-8deg)}
.cam .monitor .win{position:absolute;left:58px;top:40px;width:220px;height:280px;background:#eff0f1;border-radius:6px;display:grid;place-items:center}
.cam .monitor .qr{width:150px;height:150px;background:#fff;padding:8px;border-radius:4px}
.camwrap{position:absolute;inset:0;color:#fff}
.camwrap .tab{color:#fff;position:relative;z-index:2}
.camwrap .tab .ib{color:#fff}
.hole{position:absolute;left:78px;top:188px;width:256px;height:256px;border-radius:24px;box-shadow:0 0 0 2000px rgba(0,0,0,.55);border:2px solid #fff}
.hole.busy{border:4px solid #AAC7FF}
.hole .center{position:absolute;inset:0;display:grid;place-items:center}
.caminstr{position:absolute;left:24px;right:24px;top:468px;text-align:center;font-size:16px;line-height:24px;color:#fff}
.spinner{border-radius:50%;border:4px solid currentColor;border-right-color:transparent;border-bottom-color:transparent;transform:rotate(30deg)}
.camblank{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.camblank .msg{font-size:16px;color:#fff}
.camblank .btn.filled{background:#AAC7FF;color:#0A305F}
/* status bar icons */
.sbi{display:inline-block}
/* notification shade */
.shade{width:412px;border-radius:28px;background:var(--shade);padding:16px 12px 20px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.14)}
.nlabel{font-size:12px;color:var(--on-surface-variant);margin:14px 8px 6px}
.nlabel:first-child{margin-top:0}
.ncard{background:var(--shade-card);border-radius:24px;padding:14px 16px 12px;display:flex;gap:12px}
.nicon{width:32px;height:32px;border-radius:50%;background:#0F6E68;color:#fff;display:grid;place-items:center;flex:none;margin-top:2px}
.nmain{flex:1;min-width:0}
.nhead{font-size:12px;color:var(--on-surface-variant);display:flex;gap:6px;align-items:center;line-height:16px}
.ntitle{font-size:15px;line-height:20px;font-weight:500;margin-top:2px}
.ntext{font-size:14px;line-height:20px;color:var(--on-surface-variant)}
.nbar{height:4px;border-radius:2px;background:var(--sc-highest);margin:10px 0 2px;overflow:hidden}
.nbar>i{display:block;height:100%;background:#0F6E68;border-radius:2px}
.m3.dark .nbar>i{background:#5FC7BD}
.nact{display:flex;gap:4px;margin:8px 0 0 -12px}
.nact span{font-size:14px;font-weight:500;color:#0F6E68;padding:8px 12px;border-radius:16px}
.m3.dark .nact span{color:#7FD6CC}
/* QS tiles */
.qs{width:412px;border-radius:28px;background:var(--shade);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.14)}
.qt{height:68px;border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--sc-highest);color:var(--on-surface)}
.m3.dark .qt{background:#2A2C31}
.qt .qi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(127,127,127,.18)}
.qt .ql{font-size:14px;line-height:18px;font-weight:500;white-space:nowrap}
.qt .qs2{font-size:12px;line-height:16px;opacity:.75;white-space:nowrap}
.qt.on{background:var(--primary);color:var(--on-primary)}
.m3.dark .qt.on{background:var(--primary);color:var(--on-primary)}
.qt.on .qi{background:rgba(255,255,255,.18)}
.qt.na{opacity:.45}
.qcap{grid-column:span 2;font-size:12px;color:var(--on-surface-variant);margin:6px 2px -2px}
/* share sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sc-low);border-radius:28px 28px 0 0;padding:10px 0 8px}
.m3.dark .sheet{background:var(--sc)}
.handle{width:32px;height:4px;border-radius:2px;background:var(--on-surface-variant);opacity:.4;margin:4px auto 14px}
.shprev{display:flex;gap:14px;align-items:center;padding:0 24px 16px}
.dsrow,.approw{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px;row-gap:14px}
.target{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:16px;text-align:center;color:var(--on-surface)}
.target .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:500;position:relative}
.target .av.app{border-radius:18px}
.target .badge{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;border:2px solid var(--sc-low);overflow:hidden}
.target .lbl{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shdiv{height:1px;background:var(--outline-variant);margin:8px 24px}
.toast{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:24px;background:var(--sc-highest);color:var(--on-surface);font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.m3.dark .toast{background:#3A3C41}
.toast .ti{width:24px;height:24px;border-radius:50%;overflow:hidden}

/* ---------------- Breeze (PC) ---------------- */
.bz{
  --win:#EFF0F1;--view:#FFFFFF;--text:#232629;--inactive:#707D8A;--border:#BDC1C5;--accent:#3DAEE9;
  --title:#DEE0E2;--btn:#FCFCFC;--btn-border:#B4B8BC;--panel:rgba(235,237,239,.97);--menu:#FFFFFF;--hover:rgba(61,174,233,.18);
  --neg:#DA4453;--pos:#27AE60;--neu:#F67400;--shadow:0 6px 20px rgba(0,0,0,.22);--notif:#FFFFFF;--thumbbg:#E3E5E7;
  font-family:"Noto Sans",system-ui,sans-serif;font-size:13.3px;color:var(--text)
}
.bz.dark{
  --win:#202326;--view:#141618;--text:#FCFCFC;--inactive:#A1A9B1;--border:#3F4549;--accent:#3DAEE9;
  --title:#2A2E32;--btn:#292C30;--btn-border:#4E555B;--panel:rgba(32,35,38,.97);--menu:#1E2124;--hover:rgba(61,174,233,.25);
  --shadow:0 6px 20px rgba(0,0,0,.5);--notif:#25282B;--thumbbg:#16181A;
}
.desk{border-radius:12px;padding:18px;width:620px;flex:none;position:relative;overflow:hidden}
.desk.light{background:linear-gradient(135deg,#9fb6d6,#c8d5e6 55%,#b8c7d9)}
.desk.dark{background:linear-gradient(135deg,#1c2a3c,#2b3a50 55%,#16202c)}
.panelbar{height:44px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 10px;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.trayi{width:30px;height:30px;display:grid;place-items:center;border-radius:5px;color:var(--text)}
.trayi.sel{background:var(--hover);box-shadow:inset 0 0 0 1px rgba(61,174,233,.6)}
.clock{display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:14px;margin-left:8px;padding:0 4px}
.menu{background:var(--menu);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);padding:4px 0;width:270px;color:var(--text)}
.mi{height:28px;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;margin:0 4px;border-radius:4px;white-space:nowrap}
.mi .mk{width:16px;height:16px;flex:none;display:grid;place-items:center}
.mi.dis{color:var(--inactive)}
.mi.hov{background:var(--hover);box-shadow:inset 0 0 0 1px rgba(61,174,233,.55)}
.mi .cb{width:16px;height:16px;border-radius:3px;border:1px solid var(--inactive);display:grid;place-items:center}
.mi .cb.on{border-color:var(--accent);background:rgba(61,174,233,.18);color:var(--text)}
.mi.dis .cb{opacity:.5}
.msep{height:1px;background:var(--border);margin:4px 8px;opacity:.8}
.tooltip{background:var(--menu);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center;width:max-content;max-width:300px}
.tooltip b{display:block;font-weight:600}
.tooltip span{color:var(--inactive)}
.kwin{width:400px;background:var(--win);border-radius:8px;overflow:hidden;box-shadow:var(--shadow),0 0 0 1px rgba(0,0,0,.25);flex:none;color:var(--text)}
.kwin .tb{height:32px;background:var(--title);display:flex;align-items:center;padding:0 6px 0 8px;gap:8px}
.kwin .tb .tt{flex:1;text-align:center;font-weight:400}
.kwin .tb .wb{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:var(--text)}
.kwin .ct{padding:18px}
.bbtn{height:30px;padding:0 14px;border-radius:4px;background:var(--btn);border:1px solid var(--btn-border);display:inline-flex;align-items:center;gap:6px;color:var(--text);white-space:nowrap}
.bbtn.def{border-color:var(--accent)}
.hsep{height:1px;background:var(--border);margin:14px 0;opacity:.9}
.qrcard{width:232px;height:232px;background:#fff;border-radius:6px;margin:6px auto 0}
.center{text-align:center}
.frow{display:flex;align-items:center;gap:6px}
.frow .lab{color:var(--text);margin-right:6px}
.frow .path{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.kmsg{border-radius:4px;background:color-mix(in srgb,var(--neg) 15%,var(--win));border:1px solid color-mix(in srgb,var(--neg) 50%,transparent);display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;margin-bottom:14px}
.kmsg .kt{flex:1}
.dlg{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:300px;background:var(--win);border-radius:8px;box-shadow:var(--shadow),0 0 0 1px rgba(0,0,0,.3);overflow:hidden}
.dim{position:absolute;inset:32px 0 0 0;background:rgba(0,0,0,.25)}
.notif{width:370px;background:var(--notif);border-radius:10px;box-shadow:var(--shadow),0 0 0 1px rgba(0,0,0,.12);padding:10px 12px 12px;flex:none;color:var(--text)}
.notif .nh{display:flex;align-items:center;gap:6px;color:var(--inactive);font-size:12px;height:22px}
.notif .nh .sp{flex:1}
.notif .ns{font-weight:600;margin-top:6px}
.notif .nb{margin-top:2px;line-height:1.4}
.notif .nthumb{margin-top:10px;height:150px;border-radius:5px;background:var(--thumbbg);display:flex;justify-content:center;align-items:center;gap:8px;position:relative;overflow:hidden}
.notif .nthumb .more{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:4px;background:var(--btn);border:1px solid var(--btn-border);display:grid;place-items:center}
.notif .nacts{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.notif .nacts .bbtn{flex:1;justify-content:center}
.ncol{display:flex;flex-direction:column;gap:14px}
.iconsheet{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.iconsheet .it{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--page-sub)}
.traygrid{display:grid;grid-template-columns:auto repeat(3,auto);gap:10px 18px;align-items:center;padding:14px 18px;border-radius:10px}
.traygrid .h{font-size:12px;opacity:.7}
@media (max-width:700px){ .desk{zoom:.5} .pcwide{zoom:.8} }
@media (max-width:460px){ .m3,.kwin,.notif{zoom:.8} .iconsheet{gap:16px} }
</style>

/* ---------- icons (24 grid, Material Symbols Rounded stand-ins) ---------- */
function gearPath(){
  const cx=12,cy=12,ro=9.6,ri=7.3,n=8; let d='';
  for(let i=0;i<n;i++){
    const b=i*360/n, pts=[[b-14,ri],[b-8.5,ro],[b+8.5,ro],[b+14,ri]];
    pts.forEach(([a,r],k)=>{const t=a*Math.PI/180;d+=(i==0&&k==0?'M':'L')+(cx+r*Math.cos(t)).toFixed(2)+' '+(cy+r*Math.sin(t)).toFixed(2)});
  }
  return d+'Z';
}

let seed=7; function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
function fakeQR(){
  seed=11; const n=29; let r='';
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
    if(inF) continue;
    let on = (y==6&&x%2==0)||(x==6&&y%2==0) ? true : rnd()>.52;
    if(x>=20&&x<=24&&y>=20&&y<=24){on=(x==20||x==24||y==20||y==24||(x==22&&y==22));}
    if(on) r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#000"/>`;
  }
  return `<svg viewBox="-4 -4 37 37" width="100%" height="100%" shape-rendering="crispEdges"><rect x="-4" y="-4" width="37" height="37" fill="#fff"/>${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}${r}</svg>`;
}

   ${L('Sending')}${ncard({title:'Sending screen recording',text:'31 of 48 MB',prog:.65,acts:['Send clipboard','Pause']})}
   ${L('Connecting')}${ncard({title:'Connecting…',text:PC,acts:['Send clipboard','Pause']})}
   ${L('PC unreachable')}${ncard({title:'PC unreachable',text:'3 waiting',acts:['Send clipboard','Pause']})}
   ${L('Waiting for Wi-Fi')}${ncard({title:'Waiting for Wi-Fi',text:'2 waiting',acts:['Send clipboard','Pause']})}
   ${L('Paused')}${ncard({title:'Paused',text:'Automatic sending is off',acts:['Send clipboard','Resume']})}
   ${L('Alerts channel')}${ncard({title:'Pneu may stop in the background',text:'Battery use is set to Optimized',acts:['Fix']})}
   <div style="height:8px"></div>${ncard({title:'Pneu was stopped in the background',text:'Add Pneu to Never sleeping apps',acts:['Fix']})}
   <div style="height:8px"></div>${ncard({title:'Pneu can\'t see new screenshots',text:'Photo access was turned off',acts:['Fix']})}
   <div style="height:8px"></div>${ncard({title:'Pairing lost',text:`${PC} doesn't recognize this phone`,acts:['Pair again']})}
  </div></div>`;
}
function qtile({on=false,na=false,icon,label,sub}){
  return `<div class="qt ${on?'on':''} ${na?'na':''}"><div class="qi">${icon}</div><div><div class="ql">${label}</div>${sub?`<div class="qs2">${sub}</div>`:''}</div></div>`;
}
function tiles(dark){
  const g=glyph(22), c=ic('paste_go',22,1.9);
  return `<div class="m3 ${dark?'dark':''}"><div class="qs">
   <div class="qcap" style="margin-top:0">Pneu tile: tap pauses or resumes, long-press opens Pneu</div>
   ${qtile({on:true,icon:g,label:'Pneu',sub:'Wi-Fi'})}${qtile({on:true,icon:g,label:'Pneu',sub:'Tailscale'})}
   ${qtile({on:true,icon:g,label:'Pneu',sub:'Connecting…'})}${qtile({on:true,icon:g,label:'Pneu',sub:'Offline'})}
   ${qtile({icon:g,label:'Pneu',sub:'Paused'})}${qtile({icon:g,label:'Pneu',sub:'Pairing lost'})}
   ${qtile({na:true,icon:g,label:'Pneu',sub:'Not paired'})}<div></div>
   <div class="qcap">Send clipboard tile</div>
   ${qtile({icon:c,label:'Send clipboard',sub:''})}${qtile({icon:c,label:'Send clipboard',sub:'Offline'})}
   ${qtile({na:true,icon:c,label:'Send clipboard',sub:'Not paired'})}
  </div></div>`;
}
function scrShare(dark){
  const app=(bg,l,lbl)=>`<div class="target"><div class="av app" style="background:${bg}">${l}</div><div class="lbl">${lbl}</div></div>`;
  return `<div style="position:absolute;inset:0;background:${dark?'#000':'#f2f2f2'};padding:70px 16px">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;opacity:.9">${[shotChat(dark),shotMap(),photo(),videoThumb(),shotChat(dark),photo()].map(s=>`<div style="height:170px;overflow:hidden">${s.replace('<svg','<svg width="100%" height="100%"')}</div>`).join('')}</div></div>
   <div class="scrimfull"></div>
   <div class="sheet">
    <div class="handle"></div>
    <div class="shprev"><div class="thumb" style="width:56px;height:56px">${shotChat(dark)}</div><div><div style="font-size:16px">Screenshot_20261011_140233.jpg</div><div style="font-size:14px;color:var(--on-surface-variant)">1 image</div></div></div>
    <div class="dsrow">
      <div class="target"><div class="av" style="background:#0F6E68">${ic('computer',28,1.8)}<div class="badge">${appIcon(18)}</div></div><div class="lbl">${PC}</div></div>
      <div class="target"><div class="av" style="background:#7b61ff">S</div><div class="lbl">Sam</div></div>
      <div class="target"><div class="av" style="background:#e8710a">R</div><div class="lbl">Rosa</div></div>
      <div class="target"><div class="av" style="background:#1e8e3e">J</div><div class="lbl">Jo</div></div>
    </div>
    <div class="shdiv"></div>
    <div class="approw">
      ${app('#5b6ee1','<span style="font-size:13px">QS</span>','Quick Share')}${app('#2f9e6b','M','Messages')}${app('#d14b3f','E','Email')}
      <div class="target">${appIcon(56,'squircle')}<div class="lbl">Send to PC</div></div>
      ${app('#3b82c4','N','Notes')}${app('#7a7f87','⧉','Copy')}${app('#c58b1c','F','Files')}${app('#6d4bc4','D','Drive')}
    </div>
   </div>`;
}
function toasts(dark){
  const t=(x)=>`<div class="toast"><div class="ti">${appIcon(24)}</div>${x}</div>`;
  return `<div class="m3 ${dark?'dark':''}"><div style="width:412px;border-radius:28px;background:${dark?'#000':'#f2f2f2'};padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.18)">
   <div class="nlabel" style="align-self:flex-start;margin:0">Share → Send to PC</div>
   ${t('Sending to PC')}${t('Sending 3 items to PC')}${t('PC unreachable. Queued.')}${t('Waiting for Wi-Fi. Queued.')}${t('Couldn\'t read this item')}
   <div class="nlabel" style="align-self:flex-start;margin:6px 0 0">Send clipboard (tile, notification, Home)</div>
   ${t('Clipboard sent')}${t('Clipboard is empty')}${t('PC unreachable. Not sent.')}
  </div></div>`;
}

/* ---------- PC ---------- */
function tray(name,size){return asset(`pneu-tray-${name}.svg`,size).replace(/<path class="ColorScheme-NegativeText" style="fill:currentColor;/,'<path class="ColorScheme-NegativeText" style="fill:#da4453;')}
function panel(state,sel=false){
  return `<div class="panelbar">
   <div class="trayi">${ic('clipb',20,1.6)}</div><div class="trayi">${ic('bt',20,1.6)}</div><div class="trayi">${ic('volume',20,1.6)}</div><div class="trayi">${ic('net',20,1.6)}</div>
   <div class="trayi ${sel?'sel':''}" style="color:var(--text)">${tray(state,22)}</div><div class="trayi">${ic('up',18,1.6)}</div>
   <div class="clock"><span>14:03</span><span style="opacity:.75">11/10/2026</span></div></div>`;
}
function mi(t,{dis=false,cb=null,icon=null,hov=false}={}){
  const mark = cb!==null?`<span class="cb ${cb?'on':''}">${cb?ic('check',12,2.6):''}</span>`:(icon?ic(icon,16,1.6):'');
  return `<div class="mi ${dis?'dis':''} ${hov?'hov':''}"><span class="mk">${mark}</span>${t}</div>`;
}
const SEP='<div class="msep"></div>';
function trayMenu(status,{paired=true,clip=true}={}){
  return `<div class="menu">${mi(status,{dis:true})}${SEP}${mi('Open Folder',{icon:'folder'})}${SEP}
   ${mi('Save to Folder',{cb:true})}${mi('Show Notifications',{cb:true,hov:true})}${mi('Copy Images to Clipboard',{cb:true})}${mi('Open in Image Viewer',{cb:false})}${SEP}
   ${mi('Send Clipboard to Phone',{cb:clip})}${mi('Include Images',{cb:false,dis:!clip})}${SEP}
   ${paired?mi('Configure Pneu…',{icon:'configure'}):mi('Pair Phone…',{icon:'phone'})}${mi('Quit',{icon:'exit'})}</div>`;
}
function desk(dark,inner,h=null){return `<div class="bz ${dark?'dark':''}"><div class="desk ${dark?'dark':'light'}" ${h?`style="height:${h}px"`:''}>${inner}</div></div>`}
function bothPC(fn){return `<div class="pair">${fn(false)}${fn(true)}</div>`}
function kwin(dark,content,{overlay=''}={}){
  return `<div class="bz ${dark?'dark':''}"><div class="kwin" style="position:relative"><div class="tb">${asset('pneu.svg',16)}<div class="tt">Pneu</div><div class="wb">${ic('min',16,1.6)}</div><div class="wb">${ic('close',16,1.6)}</div></div><div class="ct">${content}</div>${overlay}</div></div>`;
}
const folderRow=`<div class="frow"><span class="lab">Save to:</span><span class="path">~/Pictures/Pneu</span><span class="bbtn">Change…</span></div>`;
function winUnpaired(v){return (dark)=>{
  let top;
  if(v=='qr') top=`<div class="qrcard" style="padding:0">${QR}</div><div class="center" style="margin-top:12px">Scan with Pneu on your phone</div>`;
  if(v=='pairing') top=`<div style="height:232px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px"><div class="spinner" style="width:32px;height:32px;border-width:3px;color:var(--accent)"></div><div>Pairing with ${PH}…</div></div>`;
  if(v=='nonet') top=`<div style="height:232px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--inactive)">${ic('netdis',48,1.4)}<div style="color:var(--text)">Connect this PC to a network to pair</div></div>`;
  return kwin(dark,`${top}<div class="hsep"></div>${folderRow}<div style="display:flex;justify-content:flex-end;margin-top:14px"><span class="bbtn def">Close</span></div>`);
}}
function winPaired(v){return (dark)=>{
  const st={wifi:['var(--pos)','Connected over Wi-Fi'],ts:['var(--pos)','Connected over Tailscale'],off:['var(--inactive)','Not connected · last seen 13:58'],paused:['var(--neu)','Paused on phone']}[v=='err'?'wifi':(v=='unpair'?'wifi':v)];
  const banner = v=='err'?`<div class="kmsg">${ic('dlgerr',16,2)}<span class="kt">Can't write to ~/Pictures/Pneu.</span></div>`:'';
  const content=`${banner}<div style="display:flex;gap:14px;align-items:center"><div style="color:var(--text)">${ic('phone',48,1.3)}</div><div><div style="font-size:16px;font-weight:600">${PH}</div><div style="display:flex;align-items:center;gap:6px;margin-top:3px;opacity:.85"><span class="dot" style="background:${st[0]}"></span>${st[1]}</div></div></div>
   <div class="hsep"></div>${folderRow}<div class="hsep"></div><div style="display:flex;justify-content:space-between"><span class="bbtn">Unpair…</span><span class="bbtn def">Close</span></div>`;
  const overlay = v=='unpair'?`<div class="dim"></div><div class="dlg"><div style="padding:18px">Unpair ${PH}?<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><span class="bbtn def">Cancel</span><span class="bbtn">Unpair</span></div></div></div>`:'';
  return kwin(dark,content,{overlay});
}}
function notif(dark,{summary,body='',thumbs=null,acts=[],transient=false,side=null}){
  const th = thumbs?`<div class="nthumb">${thumbs}<span class="more">${ic('more',14)}</span></div>`:'';
  return `<div class="bz ${dark?'dark':''}"><div class="notif"><div class="nh">${asset('pneu.svg',16)}<span>Pneu</span><span>·</span><span>Just now</span><span class="sp"></span>${ic('configure',14,1.6)}<span style="width:4px"></span>${ic('close',14,1.8)}</div>
   ${side?`<div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1"><div class="ns">${summary}</div>${body?`<div class="nb">${body}</div>`:''}</div><div style="width:64px;height:48px;border-radius:4px;overflow:hidden;margin-top:6px;flex:none">${side}</div></div>`:`<div class="ns">${summary}</div>${body?`<div class="nb">${body}</div>`:''}`}${th}${acts.length?`<div class="nacts">${acts.map(a=>`<span class="bbtn">${a}</span>`).join('')}</div>`:''}</div></div>`;
}
const shotBox=(dark)=>`<div style="height:136px;width:66px;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.3)">${shotChat(dark).replace('<svg','<svg width="100%" height="100%"')}</div>`;
const mapBox=`<div style="height:136px;width:66px;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.3)">${shotMap().replace('<svg','<svg width="100%" height="100%"')}</div>`;
const fileBox=(dark)=>`<div style="height:120px;width:92px;border-radius:3px;background:${dark?'#2c3034':'#fff'};box-shadow:0 1px 3px rgba(0,0,0,.3);display:grid;place-items:center;color:#DA4453">${ic('file',40,1.4)}</div>`;
function notifs(dark){
  return `<div class="grid">
  <div class="ncol">
   <div class="cap">Screenshot received (Save, Notification and Copy on)</div>
   ${notif(dark,{summary:'Screenshot',body:'Copied to clipboard',thumbs:shotBox(dark),acts:['Open','Show in Folder']})}
   <div class="cap">Burst: replaces the notification above. Plasma previews the first URL, so the latest goes first.</div>
   ${notif(dark,{summary:'3 screenshots',body:'Latest copied to clipboard',thumbs:mapBox,acts:['Show in Folder']})}
   <div class="cap">Shared file</div>
   ${notif(dark,{summary:'invoice_october_2026_final_signed.pdf',thumbs:fileBox(dark),acts:['Open','Show in Folder']})}
  </div>
  <div class="ncol">
   <div class="cap">Text from phone (transient, low urgency)</div>
   ${notif(dark,{summary:'Copied from phone',body:'Meet at the north entrance at 7, I\'ll bring the tickets'})}
   ${notif(dark,{summary:'Copied from phone',body:'https://github.com/mjstanton/pneu/pull/12',acts:['Open Link']})}
   <div class="cap">Image clipboard from phone</div>
   ${notif(dark,{summary:'Image copied from phone',side:photo().replace('<svg','<svg width="100%" height="100%"')})}
  </div>
  <div class="ncol">
   <div class="cap">Errors</div>
   ${notif(dark,{summary:'Screenshot',body:'Not saved: can\'t write to ~/Pictures/Pneu',thumbs:shotBox(dark),acts:['Open','Choose Folder…']})}
   ${notif(dark,{summary:'Screenshot',body:'Not saved: the disk is full',acts:['Open']})}
   ${notif(dark,{summary:'Blocked an unpaired phone',body:'192.168.1.44 tried to connect',acts:['Pair Phone…']})}
   ${notif(dark,{summary:`${PH} unpaired this PC`,acts:['Pair Phone…']})}
   ${notif(dark,{summary:'Pneu can\'t receive',body:'Port 47811 is in use by another program'})}
  </div></div>`;
}

/* ---------- page ---------- */
function mock(id,title,note,html){return `<section class="mock" id="${id}"><h3>${title}</h3>${note?`<p class="note">${note}</p>`:''}${html}</section>`}
function brand(){
  const it=(html,cap)=>`<div class="it">${html}<span>${cap}</span></div>`;
  const layer=(n,s)=>`<div style="width:${s}px;height:${s}px;background:repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 0 0/16px 16px;border-radius:6px;overflow:hidden">${asset(n,s)}</div>`;
  const mono=(bg,fg)=>`<div style="width:96px;height:96px;border-radius:50%;background:${bg};color:${fg};overflow:hidden;display:grid;place-items:center"><div style="width:133.3%;height:133.3%;flex:none">${asset('ic_launcher_monochrome.svg',128).replace(/fill="#000000"/g,'fill="currentColor"')}</div></div>`;
  let trayRows='';
  for(const [cls,bg,fg] of [['light','#E9EBED','#232629'],['dark','#202326','#FCFCFC']]){
    trayRows+=`<div class="traygrid" style="background:${bg};color:${fg}"><span class="h">${cls} panel</span><span class="h">16 px</span><span class="h">22 px</span><span class="h">44 px (2×)</span>`;
    for(const s of ['connected','receiving','disconnected','paused','error']){
      trayRows+=`<span style="font-size:12px">${s}</span>${[16,22,44].map(z=>`<span>${tray(s,z)}</span>`).join('')}`;
    }
    trayRows+='</div>';
  }
  return `<h2 class="sec" id="brand">Brand and icons</h2>
  ${mock('launcher','App icon','Adaptive icon (background and foreground layers), shown under One UI squircle and round masks, plus the themed monochrome icon and the PC app icon.',
    `<div class="iconsheet">${it(appIcon(160,'squircle'),'One UI mask')}${it(appIcon(160,'circle'),'Round mask')}${it(appIcon(64,'squircle'),'64 px')}${it(appIcon(48,'squircle'),'48 px')}
     ${it(layer('ic_launcher_background.svg',108),'background layer')}${it(layer('ic_launcher_foreground.svg',108),'foreground layer')}
     ${it(mono('#C9EDE7','#0A3B38'),'themed (light)')}${it(mono('#284777','#D6E3FF'),'themed (dark)')}
     ${it(asset('pneu.svg',96),'PC app icon')}${it(`<div style="display:flex;gap:10px;align-items:center;background:#0F6E68;color:#fff;padding:10px;border-radius:8px">${glyph(24)}${glyph(18)}</div>`,'status bar / tile glyph')}</div>`)}
  ${mock('trayicons','Tray icons','Monochrome, recoloured by Plasma (ColorScheme-Text); the error badge uses ColorScheme-NegativeText. No phone paired and pairing use the disconnected icon.',`<div class="grid">${trayRows}</div>`)}`;
}
function build(){
  let h=`<div class="pagehead"><h1>Pneu</h1></div>
  <div class="toc"><a href="#brand">Brand</a><a href="#setup">Setup</a><a href="#pair">Pair</a><a href="#home">Home</a><a href="#settings">Settings</a><a href="#notifications">Notifications</a><a href="#tiles">Quick Settings</a><a href="#share">Share</a><a href="#tray">Tray</a><a href="#window">Window</a><a href="#pcnotifs">PC notifications</a></div>`;
  h+=brand();
  h+=`<h2 class="sec">Phone</h2><div class="mocks">`;
  h+=mock('setup','Setup (first run)','Continue is always enabled; anything skipped returns as a Home banner. Never sleeping apps shows on Samsung only.',both(scrSetup('initial')));
  h+=mock('setup2','Setup, partly done','Limited photo access shows as not done with Allow all.',both(scrSetup('partial')));
  h+=mock('perms','Permissions and battery (from Settings or a banner)','A permission denied twice opens system settings instead.',both(()=>scrPermissions()));
  h+=mock('pair','Pair: camera permission','The Pair screen always uses the dark colour scheme, in both themes.',darkOnly(scrPair('camera'),{sbLight:true}));
  h+=mock('pair1b','Pair: camera permanently denied','',darkOnly(scrPair('denied'),{sbLight:true}));
  h+=mock('pair2','Pair: scanning, wrong code','Snackbar for 3 s; scanning continues.',darkOnly(scrPair('notpneu'),{sbLight:true}));
  h+=mock('pair2b','Pair: expired code','',darkOnly(scrPair('expired'),{sbLight:true}));
  h+=mock('pair3','Pair: pairing','Back is disabled for up to 15 s.',darkOnly(scrPair('pairing'),{sbLight:true}));
  h+=mock('pair4','Pair: can\'t reach the PC','Cancel resumes scanning; Try again retries the same code.',darkOnly(scrPair('unreachable'),{sbLight:true}));
  h+=mock('pair5','Pair: paired','Shown for 800 ms, then Home.',darkOnly(scrPair('paired'),{sbLight:true}));
  h+=mock('home','Home: connected over Wi-Fi','A large transfer shows progress around its cancel button. Small screenshots flip straight to their time.',both(scrHome('wifi')));
  h+=mock('home2','Home: just paired, connected over Tailscale','',both(scrHome('tsEmpty')));
  h+=mock('home3','Home: connecting','',both(scrHome('connecting')));
  h+=mock('home4','Home: PC unreachable with a queue','“3 waiting” opens a menu: Send now, Don\'t send any.',both(scrHome('unreachable')));
  h+=mock('home5','Home: away from home, Tailscale off','',both(scrHome('tsOff')));
  h+=mock('home6','Home: waiting for Wi-Fi (mobile data off)','',both(scrHome('wifiwait')));
  h+=mock('home7','Home: paused','Screenshots taken while paused are skipped, not queued. Send clipboard and Share still work.',both(scrHome('paused')));
  h+=mock('home8','Home: pairing lost','',both(scrHome('lost')));
  h+=mock('home9','Home: setup issue and a failed item','One banner at a time; several issues read “{n} settings need attention”.',both(scrHome('banner')));
  h+=mock('settings','Settings','',both(scrSettings(''),{tall:true}));
  h+=mock('settings2','Settings: Tailscale missing, mobile data off, last connection method blocked','',both(scrSettings('alt'),{tall:true}));
  h+=mock('unpair','Unpair dialog','The second line appears only when items are waiting.',both(()=>scrUnpair()));
  h+=mock('notifications','Status notification and alerts','One ongoing notification whose content follows the state; alerts are a separate channel. When pairing is lost the service stops and only the alert remains.',`<div class="pair">${shade(false)}${shade(true)}</div>`);
  h+=mock('tiles','Quick Settings tiles','',`<div class="pair">${tiles(false)}${tiles(true)}</div>`);
  h+=mock('share','Share sheet','“Send to PC” in the app row, and the PC as a Direct Share target. No confirmation screen.',both((d)=>scrShare(d)));
  h+=mock('toasts','Toasts','',`<div class="pair">${toasts(false)}${toasts(true)}</div>`);
  h+=`</div><h2 class="sec">PC</h2><div class="mocks">`;
  h+=mock('tray','Tray: connected, menu open','Left click opens the window; right click opens this menu.',bothPC(d=>desk(d,`<div style="display:flex;justify-content:flex-end;margin-bottom:10px">${trayMenu(`${PH} connected over Wi-Fi`)}</div>${panel('connected',true)}`)));
  h+=mock('tray2','Tray: no phone paired, tooltip','',bothPC(d=>desk(d,`<div style="display:flex;justify-content:flex-end;gap:14px;align-items:flex-end;margin-bottom:10px"><div class="tooltip">${asset('pneu.svg',32)}<div><b>Pneu</b><span>No phone paired</span></div></div>${trayMenu('No phone paired',{paired:false})}</div>${panel('disconnected',true)}`)));
  h+=mock('tray3','Tray tooltips by state','',bothPC(d=>desk(d,`<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end;margin-bottom:10px">
     <div class="tooltip">${asset('pneu.svg',32)}<div><b>Pneu</b><span>${PH} isn't connected<br>Last seen 13:58</span></div></div>
     <div class="tooltip">${asset('pneu.svg',32)}<div><b>Pneu</b><span>Receiving from ${PH}…</span></div></div>
     <div class="tooltip">${asset('pneu.svg',32)}<div><b>Pneu</b><span>${PH} paused sending</span></div></div>
     <div class="tooltip">${asset('pneu.svg',32)}<div><b>Pneu</b><span>Can't save to ~/Pictures/Pneu</span></div></div></div>
     <div style="display:flex;flex-direction:column;gap:8px">${panel('disconnected')}${panel('receiving')}${panel('paused')}${panel('error')}</div>`)));
  h+=mock('window','Window: unpaired','Opens on its own when the daemon starts unpaired. The QR refreshes every 5 minutes.',bothPC(winUnpaired('qr')));
  h+=mock('window2','Window: phone connecting with the code','',bothPC(winUnpaired('pairing')));
  h+=mock('window3','Window: no network','',bothPC(winUnpaired('nonet')));
  h+=mock('window4','Window: paired and connected','',bothPC(winPaired('wifi')));
  h+=mock('window5','Window: paired, phone not connected','',bothPC(winPaired('off')));
  h+=mock('window6','Window: paired, phone paused','',bothPC(winPaired('paused')));
  h+=mock('window7','Window: save folder error','',bothPC(winPaired('err')));
  h+=mock('window8','Window: unpair confirmation','',bothPC(winPaired('unpair')));
  h+=`<section class="mock" id="pcnotifs"><h3>Notifications, light</h3>${notifs(false)}</section><section class="mock"><h3>Notifications, dark</h3>${notifs(true)}</section></div>`;
  document.getElementById('app').innerHTML=h;
}
build();
</script>
</body>
</html>
