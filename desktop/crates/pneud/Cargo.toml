[package]
name = "pneud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Opt in only for Windows packaging; ordinary Unix builds retain one CLI bin.
windows-package = []

[[bin]]
name = "Pneu"
path = "src/main_windows.rs"
required-features = ["windows-package"]

[dependencies]
pneu-proto = { path = "../pneu-proto" }
anyhow = "1"
async-trait = "0.1"
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ring = "0.17"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "sync", "time", "signal", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", features = ["pem"] }
x509-parser = { version = "0.18", features = ["verify"] }
rand = "0.9"
subtle = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
toml = "0.9"
mdns-sd = "0.17"
if-addrs = "0.15"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false }
url = "2"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

resvg = "0.47"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "event", "system"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"
zbus = { version = "5", default-features = false, features = ["tokio"] }
wl-clipboard-rs = "=0.9.4"
ksni = "0.3"
slint = { version = "=1.15.1", default-features = false, features = ["std", "backend-qt", "backend-winit", "unstable-winit-030", "renderer-software", "compat-1-2"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "objc2-core-foundation"] }
objc2-user-notifications = "=0.3.2"
block2 = "=0.6.2"
slint = { version = "=1.15.1", default-features = false, features = ["std", "backend-winit", "unstable-winit-030", "renderer-software", "compat-1-2"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "clipboard_headless"
harness = false

# Windows resources only: discovers the SDK resource compiler and emits the
# Cargo link directives for the icon and VERSIONINFO in both executables.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
socket2 = "0.6.5"
windows-core = "=0.62.2"
slint = { version = "=1.15.1", default-features = false, features = ["std", "backend-winit", "unstable-winit-030", "renderer-software", "compat-1-2"] }
tray-icon = { version = "=0.21.3", default-features = false }
muda = { version = "=0.17.2", default-features = false }
windows = { version = "=0.62.2", features = ["Storage", "Storage_Search", "ApplicationModel", "ApplicationModel_Activation", "ApplicationModel_DataTransfer", "ApplicationModel_DataTransfer_ShareTarget", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Gdi", "Win32_System_Recovery", "Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Storage_Packaging_Appx", "Win32_System_WinRT", "Win32_UI_Notifications", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse"] }
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_HiDpi"] }
