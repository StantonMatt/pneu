name: Desktop release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (dry run; artifacts only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    # The standard macos-15 label is Apple Silicon (arm64).
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.4"
    steps:
      - name: Validate the tag input
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check version and install the workspace Rust toolchain
        working-directory: desktop
        run: |
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              package = tomllib.load(manifest)["workspace"]["package"]
          expected = f'v{package["version"]}'
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f'Tag must match workspace version: expected {expected}')
          PY
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$rust_version" --profile minimal
          rustup default "$rust_version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build the ad-hoc-signed app
        run: desktop/packaging/macos/build-app.sh --profile release --out "$RUNNER_TEMP/pneu-release"
      - name: Zip the app and calculate its checksum
        run: |
          cd "$RUNNER_TEMP/pneu-release"
          ditto -c -k --sequesterRsrc --keepParent Pneu.app Pneu-macOS.zip
          shasum -a 256 Pneu-macOS.zip > SHA256SUMS.txt
      - name: Upload build artifacts (also used for manual dry runs)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pneu-macOS
          path: |
            ${{ runner.temp }}/pneu-release/Pneu-macOS.zip
            ${{ runner.temp }}/pneu-release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux:
    # Build on the oldest supported glibc/Qt baseline, not ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    env:
      QMAKE: qmake6
    steps:
      - name: Validate the tag input
        working-directory: .
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install Qt 6 and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config qt6-base-dev qt6-base-dev-tools qmake6 \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libudev-dev \
            dbus-daemon dpkg-dev
      - name: Check version and install the workspace Rust toolchain
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$rust_version" --profile minimal
          rustup default "$rust_version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build and package Linux downloads
        run: |
          cargo build --release --locked -p pneud
          packaging/linux/build-packages.sh target/release/pneud "${RELEASE_TAG#v}" "$RUNNER_TEMP/pneu-linux"
          cp "$RUNNER_TEMP/pneu-linux/pneu_${RELEASE_TAG#v}_amd64.deb" "$RUNNER_TEMP/pneu-linux/pneu-linux-amd64.deb"
      - name: Upload Linux artifacts (manual dry runs publish nothing)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pneu-Linux
          path: |
            ${{ runner.temp }}/pneu-linux/*.deb
            ${{ runner.temp }}/pneu-linux/pneu-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-msix:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate the tag input
        run: |
          if ($env:RELEASE_TAG -notlike 'v*') { throw 'Expected a version tag' }
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check version and install the workspace Rust toolchain
        working-directory: desktop
        run: |
          $version = python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match workspace version' }
          $rust = python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install $rust --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $rust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build unsigned Store MSIX
        run: >-
          desktop/packaging/windows/build-msix.ps1
          -IdentityName MatthewStanton.Pneu
          -Publisher 'CN=68A11A39-FF28-48D5-9C3E-D4758423D785'
          -PublisherDisplayName 'Matthew Stanton'
          -OutDir "$env:RUNNER_TEMP/pneu-msix"
      # Partner Center accepts unsigned packages and signs them for distribution.
      # Keep this Store package as a workflow artifact; submission is a separate gate.
      - name: Upload unsigned Store MSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pneu-Windows-Store-msix
          path: ${{ runner.temp }}/pneu-msix/*.msix
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [build, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Pneu-macOS
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Pneu-Linux
          path: release
      - name: Create or update the GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS.txt
          assets=(Pneu-macOS.zip pneu_*_amd64.deb pneu-linux-amd64.deb pneu-linux-x86_64.tar.gz)
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt \
              --verify-tag --title "Pneu $RELEASE_TAG" \
              --notes 'Downloads and installation: https://stantonmatt.github.io/pneu/'
          fi
